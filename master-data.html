  ];

  /* VALIDATE-BEGIN */
  function stored(docId) { return (S.master[docId] && S.master[docId].items) || []; }
  function validKm(a, b) { return typeof a === 'number' && typeof b === 'number' && isFinite(a) && isFinite(b); }
  function kmTxt(v) { return typeof v === 'number' && isFinite(v) ? fmtKm(v) : '?'; }
  function round1(v) { return Math.round(v * 10) / 10; }
  function extraDecimal(v) { return typeof v === 'number' && isFinite(v) && Math.abs(v * 10 - Math.round(v * 10)) > 1e-6; }
  function zoneSideKey(s) { return s === 'ซ้ายทาง' ? 'L' : (s === 'ขวาทาง' ? 'R' : 'B'); }
  function sidesClash(a, b) { return a === b || a === 'B' || b === 'B'; }
  function mergeRanges(rs, tol) {
    const out = [];
    rs.slice().sort(function (a, b) { return a[0] - b[0]; }).forEach(function (r) {
      const l = out[out.length - 1];
      if (l && r[0] <= l[1] + (tol || 0)) l[1] = Math.max(l[1], r[1]); else out.push([r[0], r[1]]);
    });
    return out;
  }
  // ช่วงที่หมวดดูแล (kmRanges ของสายทางที่ยังไม่โอน) แต่ไม่มีเขตพื้นที่ครอบ แยกซ้าย/ขวา (ซ้ายเท่ากับขวา = ทั้งสองฝั่ง)
  function computeGaps(get) {
    const zones = get('zones'), routes = get('routes').filter(function (r) { return r.status !== 'transferred'; });
    const byHw = {};
    routes.forEach(function (r) {
      const k = String(r.highway).trim();
      (r.kmRanges || []).forEach(function (p) { if (validKm(p[0], p[1]) && p[0] < p[1]) (byHw[k] = byHw[k] || []).push([p[0], p[1]]); });
    });
    const out = [];
    Object.keys(byHw).sort(function (a, b) { return Number(a) - Number(b); }).forEach(function (hw) {
      const ranges = mergeRanges(byHw[hw], 0), cover = { L: [], R: [] };
      zones.forEach(function (z) {
        if (String(z.highway).trim() !== hw || !validKm(z.kmStart, z.kmEnd) || z.kmStart >= z.kmEnd) return;
        const k = zoneSideKey(z.side);
        if (k !== 'R') cover.L.push([z.kmStart, z.kmEnd]);
        if (k !== 'L') cover.R.push([z.kmStart, z.kmEnd]);
      });
      const gaps = { L: [], R: [] };
      ['L', 'R'].forEach(function (sd) {
        const cv = mergeRanges(cover[sd], KM_TOL);
        ranges.forEach(function (rg) {
          let cur = rg[0];
          cv.forEach(function (iv) {
            if (iv[1] <= cur || iv[0] >= rg[1]) return;
            if (iv[0] - cur > KM_TOL) gaps[sd].push([cur, Math.min(iv[0], rg[1])]);
            cur = Math.max(cur, iv[1]);
          });
          if (rg[1] - cur > KM_TOL) gaps[sd].push([cur, rg[1]]);
        });
      });
      const used = {};
      gaps.L.forEach(function (g) {
        const j = gaps.R.findIndex(function (h, i) { return !used[i] && Math.abs(h[0] - g[0]) <= KM_TOL && Math.abs(h[1] - g[1]) <= KM_TOL; });
        if (j >= 0) { used[j] = true; out.push({ hw: hw, side: 'B', s: g[0], e: g[1] }); }
        else out.push({ hw: hw, side: 'L', s: g[0], e: g[1] });
      });
      gaps.R.forEach(function (h, i) { if (!used[i]) out.push({ hw: hw, side: 'R', s: h[0], e: h[1] }); });
    });
    out.sort(function (a, b) { return Number(a.hw) - Number(b.hw) || a.s - b.s || a.side.localeCompare(b.side); });
    out.forEach(function (g) { g.key = g.hw + '|' + g.side + '|' + g.s + '|' + g.e; });
    return out;
  }
  function gapText(g) { return 'ทล.' + g.hw + ' ' + (g.side === 'B' ? '' : SIDE_LABEL[g.side] + ' ') + fmtKm(g.s) + ' – ' + fmtKm(g.e) + ' (ยาว ' + fmtNum((g.e - g.s) / 1000, 3) + ' กม.)'; }

  // เขตพื้นที่ที่ทับกัน (ฝั่งชนกันและซ้อนกันเกิน KM_TOL) รวมเป็นกลุ่มเดียวกัน
  function zoneOverlapGroups(get) {
    const byHw = {}, groups = [];
    get('zones').forEach(function (z) {
      if (!validKm(z.kmStart, z.kmEnd) || z.kmStart >= z.kmEnd) return;
      (byHw[String(z.highway).trim()] = byHw[String(z.highway).trim()] || []).push(z);
    });
    Object.keys(byHw).forEach(function (hw) {
      const zs = byHw[hw].slice().sort(function (a, b) { return a.kmStart - b.kmStart; });
      const par = zs.map(function (_, i) { return i; });
      const find = function (i) { while (par[i] !== i) { par[i] = par[par[i]]; i = par[i]; } return i; };
      for (let i = 0; i < zs.length; i++) {
        for (let j = i + 1; j < zs.length && zs[j].kmStart < zs[i].kmEnd - KM_TOL; j++) {
          if (sidesClash(zoneSideKey(zs[i].side), zoneSideKey(zs[j].side)) && Math.min(zs[i].kmEnd, zs[j].kmEnd) - zs[j].kmStart > KM_TOL) par[find(j)] = find(i);
        }
      }
      const cl = {};
      zs.forEach(function (z, i) { (cl[find(i)] = cl[find(i)] || []).push(z); });
      Object.keys(cl).forEach(function (k) { if (cl[k].length > 1) groups.push({ hw: hw, zones: cl[k] }); });
    });
    return groups;
  }
  function zoneLabel(z) {
    const where = (z.moobans || []).length ? 'หมู่ ' + z.moobans.join(', ') : (z.tambon || z.station || '');
    return fmtKm(z.kmStart) + '–' + fmtKm(z.kmEnd) + (z.side ? ' ' + z.side : ' ไม่ระบุฝั่ง') + (where ? ' [' + where + ']' : '');
  }

  function validateAll(get) {
    const out = [];
    const add = function (sev, cat, docs, text, extra) { out.push(Object.assign({ sev: sev, cat: cat, docs: docs, text: text, sig: cat + '|' + text }, extra || {})); };
    const routes = get('routes'), zones = get('zones'), rows = get('rightofway'), surf = get('surface'), wcs = get('workcodes');

    // --- สายทาง ---
    const seenRoute = {};
    routes.forEach(function (r) {
      const nm = 'ทล.' + r.highway + (r.controlNo ? ' ตอน ' + r.controlNo : '');
      (r.kmRanges || []).forEach(function (p) {
        if (!validKm(p[0], p[1]) || p[0] >= p[1]) add('err', 'route-bad', ['routes'], nm + ' ช่วง กม. ' + kmTxt(p[0]) + ' – ' + kmTxt(p[1]) + ' ไม่ถูกต้อง (เริ่ม ≥ สิ้นสุด)');
      });
      if (seenRoute[r.id]) add('err', 'route-bad', ['routes'], nm + ' มีรหัสสายทางซ้ำ (' + r.id + ')');
      seenRoute[r.id] = true;
    });

    // --- เขตพื้นที่ ---
    zones.forEach(function (z) {
      if (!validKm(z.kmStart, z.kmEnd) || z.kmStart >= z.kmEnd) add('err', 'zone-bad', ['zones'], 'ทล.' + z.highway + ' เขตพื้นที่ ' + kmTxt(z.kmStart) + ' – ' + kmTxt(z.kmEnd) + ' ช่วง กม. ไม่ถูกต้อง (เริ่ม ≥ สิ้นสุด)');
    });
    computeGaps(get).forEach(function (g) { add('warn', 'zone-gap', ['zones', 'routes'], gapText(g), { gap: g }); });
    zoneOverlapGroups(get).forEach(function (g) {
      add('warn', 'zone-overlap', ['zones'], 'ทล.' + g.hw + ' มี ' + g.zones.length + ' รายการทับกัน: ' + g.zones.map(zoneLabel).join(' | '));
    });

    // --- บัญชีเขตทาง ---
    rows.forEach(function (x) {
      const nm = 'ทล.' + x.highway + ' ลำดับ ' + x.seq + ' (' + kmTxt(x.kmStart) + (x.kmStart === x.kmEnd ? '' : ' – ' + kmTxt(x.kmEnd)) + ')';
      if (!validKm(x.kmStart, x.kmEnd) || x.kmStart > x.kmEnd) {
        add('err', 'row-reversed', ['rightofway'], 'ทล.' + x.highway + ' ลำดับ ' + x.seq + ' ช่วง ' + kmTxt(x.kmStart) + ' → ' + kmTxt(x.kmEnd) + ' เริ่มมากกว่าสิ้นสุด หรือไม่มีค่า กม.');
        return;
      }
      if (x.left == null && x.right == null) add('warn', 'row-empty', ['rightofway'], nm + ' ไม่มีข้อมูลความกว้างทั้งซ้ายและขวา');
      else if (x.left == null || x.right == null) add('warn', 'row-side', ['rightofway'], nm + ' ไม่มีความกว้างฝั่ง' + (x.left == null ? 'ซ้าย' : 'ขวา'));
    });

    // --- ผิวทาง ---
    surf.forEach(function (x) {
      const nm = 'ทล.' + x.highway + ' ' + (SIDE_TH[x.side] || x.side) + ' ' + kmTxt(x.kmStart) + ' – ' + kmTxt(x.kmEnd);
      if (!validKm(x.kmStart, x.kmEnd) || x.kmStart >= x.kmEnd) add('err', 'surf-bad', ['surface'], nm + ' ช่วง กม. ไม่ถูกต้อง (เริ่ม ≥ สิ้นสุด)');
      else if (!(x.lanes >= 1)) add('warn', 'surf-bad', ['surface'], nm + ' จำนวนช่องจราจรไม่ถูกต้อง (' + x.lanes + ')');
    });
    const sg = {};
    surf.forEach(function (x) { if (validKm(x.kmStart, x.kmEnd) && x.kmStart < x.kmEnd) (sg[String(x.highway) + '|' + x.side] = sg[String(x.highway) + '|' + x.side] || []).push(x); });
    Object.keys(sg).forEach(function (k) {
      const a = sg[k].slice().sort(function (p, q) { return p.kmStart - q.kmStart; });
      let prev = null;
      a.forEach(function (x) {
        if (prev && x.kmStart < prev.kmEnd - KM_TOL) add('warn', 'surf-overlap', ['surface'], 'ทล.' + x.highway + ' ' + (SIDE_TH[x.side] || x.side) + ' ' + fmtKm(prev.kmStart) + '–' + fmtKm(prev.kmEnd) + ' ทับ ' + fmtKm(x.kmStart) + '–' + fmtKm(x.kmEnd));
        if (!prev || x.kmEnd > prev.kmEnd) prev = x;
      });
    });
    routes.forEach(function (r) {
      if (r.status === 'transferred') return;
      const s = surfaceStats(r, get);
      if (!s) return;
      const nm = 'ทล.' + r.highway + (r.controlNo ? ' ตอน ' + r.controlNo : '');
      if (Math.abs(s.distance2Lane - (r.distance2Lane || 0)) > 0.005) add('warn', 'route-surface', ['routes', 'surface'], nm + ' ระยะเทียบ 2 ช่องจราจร สายทาง ' + fmtNum(r.distance2Lane || 0, 3) + ' ≠ ผิวทาง ' + fmtNum(s.distance2Lane, 3) + ' กม.');
      if (Math.abs(s.distanceActual - (r.distanceActual || 0)) > 0.005) add('warn', 'route-surface', ['routes', 'surface'], nm + ' ระยะจริง สายทาง ' + fmtNum(r.distanceActual || 0, 3) + ' ≠ ผิวทาง ' + fmtNum(s.distanceActual, 3) + ' กม.');
    });

    // --- รหัสอ้างอิงซ้ำ ---
    [['zones', zones, 'เขตพื้นที่'], ['rightofway', rows, 'บัญชีเขตทาง'], ['surface', surf, 'ผิวทาง']].forEach(function (d) {
      const seen = {};
      d[1].forEach(function (x) {
        if (seen[x.id]) add('err', 'dup-id', [d[0]], d[2] + ': รหัสอ้างอิง ' + x.id + ' ซ้ำกัน (ทล.' + x.highway + ' ' + kmTxt(x.kmStart) + ')');
        seen[x.id] = true;
      });
    });

    // --- รหัสงาน ---
    const wcSeen = {}, wcByCode = {};
    wcs.forEach(function (x) { wcByCode[x.code] = true; });
    wcs.forEach(function (x) {
      if (wcSeen[x.code]) add('err', 'wc-dup', ['workcodes'], 'รหัสงาน ' + x.code + ' ซ้ำกัน (' + String(x.name).slice(0, 40) + ')');
      wcSeen[x.code] = true;
      if (x.parent && !wcByCode[x.parent]) add('warn', 'wc-dup', ['workcodes'], 'รหัสงาน ' + x.code + ' อ้างรหัสแม่ ' + x.parent + ' ซึ่งไม่มีในรายการ');
    });

    // --- ราคาประเมิน (ปีงบปัจจุบัน หรือปีงบล่าสุดที่มีราคา) ---
    const cur = currentFiscalYear();
    const yrs = Object.keys(S.master).concat(Object.keys(S.drafts)).map(function (k) { const m = k.match(/^assets_(\d{4})$/); return m ? Number(m[1]) : 0; })
      .filter(function (y) { return y && y <= cur && get(assetDocId(y)).length; }).sort(function (a, b) { return b - a; });
    if (yrs.length) {
      const aDoc = assetDocId(yrs[0]), all = get(aDoc), byName = {}, seenKey = {};
      all.forEach(function (a) {
        if (seenKey[a.key]) add('err', 'asset-keydup', [aDoc], 'รหัสรายการ ' + a.key + ' ซ้ำกัน (' + String(a.name).slice(0, 40) + ')');
        seenKey[a.key] = true;
        if (a.hidden) return;
        const label = a.key + ' ' + String(a.name || '').slice(0, 50);
        if (!String(a.name || '').trim()) add('warn', 'asset-unit', [aDoc], a.key + ' ไม่มีชื่อรายการ');
        if (!String(a.unit || '').trim()) add('warn', 'asset-unit', [aDoc], label + ' ไม่มีหน่วย');
        if (!(Number(a.price) > 0)) add('warn', 'asset-zero', [aDoc], label + ' ราคา ' + (a.price == null ? 'ว่าง' : fmtNum(a.price, 2)) + ' บาท');
        const nk = String(a.name || '').toLowerCase().replace(/\s+/g, '');
        if (nk) (byName[nk] = byName[nk] || []).push(a);
      });
      Object.keys(byName).forEach(function (k) {
        const g = byName[k];
        if (g.length > 1) add('warn', 'asset-dup', [aDoc], 'ชื่อซ้ำ ' + g.length + ' รายการ "' + String(g[0].name).slice(0, 60) + '": ' + g.map(function (a) { return a.key + ' (' + (a.unit || 'ไม่มีหน่วย') + ' ' + fmtNum(a.price, 2) + ')'; }).join(', '));
      });
    }

    // --- ทศนิยม กม. เกิน 1 ตำแหน่งของเมตร (ปัดให้ตอนบันทึก) ---
    [['zones', zones, 'เขตพื้นที่'], ['rightofway', rows, 'บัญชีเขตทาง'], ['surface', surf, 'ผิวทาง']].forEach(function (d) {
      const bad = [];
      d[1].forEach(function (x) { [x.kmStart, x.kmEnd].forEach(function (v) { if (extraDecimal(v)) bad.push(v); }); });
      if (bad.length) add('warn', 'km-decimal', [d[0]], d[2] + ': ' + bad.length + ' ค่า (เช่น ' + bad.slice(0, 3).join(', ') + ')', { auto: true });
    });
    const rb = [];
    routes.forEach(function (r) { (r.kmRanges || []).forEach(function (p) { p.forEach(function (v) { if (extraDecimal(v)) rb.push(v); }); }); });
    if (rb.length) add('warn', 'km-decimal', ['routes'], 'สายทาง: ' + rb.length + ' ค่า (เช่น ' + rb.slice(0, 3).join(', ') + ')', { auto: true });
    return out;
  }

  // ตอนบันทึก: ปัด กม. ในฉบับร่างให้ทศนิยมไม่เกิน 1 ตำแหน่งของเมตร (เช่น 248187.89999999999 → 248187.9)
  function roundDraftKm() {
    Object.keys(S.drafts).forEach(function (docId) {
      const d = S.drafts[docId];
      if (!Array.isArray(d.items)) return;
      let n = 0;
      const ex = [];
      const fix = function (v) { if (!extraDecimal(v)) return v; n++; if (ex.length < 3) ex.push(v + '→' + round1(v)); return round1(v); };
      let list = null;
      if (docId === 'zones' || docId === 'rightofway' || docId === 'surface') {
        list = d.items.map(function (x) {
          const o = Object.assign({}, x);
          if (extraDecimal(x.kmStart)) o.kmStart = fix(x.kmStart);
          if (extraDecimal(x.kmEnd)) o.kmEnd = fix(x.kmEnd);
          return o;
        });
      } else if (docId === 'routes') {
        list = d.items.map(function (x) { return Object.assign({}, x, { kmRanges: (x.kmRanges || []).map(function (p) { return [fix(p[0]), fix(p[1])]; }) }); });
      }
      if (n) { d.items = list; d.changes.push('ปัดเศษ กม. ให้ไม่เกิน 1 ตำแหน่งของเมตร ' + n + ' ค่า (เช่น ' + ex.join(', ') + ')'); }
    });
  }
  /* VALIDATE-END */

  function vCatTitle(cat) { const c = VCATS.find(function (x) { return x.cat === cat; }); return c ? c.title : cat; }
  function vSevPill(i) { return i.sev === 'err' ? '<span class="pill err">ร้ายแรง</span>' : '<span class="pill warn">เตือน</span>'; }

  // ช่องว่างที่เคยมีอยู่แล้วในฐานข้อมูล (หรือเล็กลงจากเดิม) ไม่นับเป็นปัญหาใหม่
  function isNewIssue(i, baseSigs, baseGaps) {
    if (baseSigs[i.sig]) return false;
    if (i.cat === 'zone-gap') {
      const g = i.gap;
      return !baseGaps.some(function (b) { return b.hw === g.hw && (b.side === g.side || b.side === 'B') && b.s <= g.s + KM_TOL && b.e >= g.e - KM_TOL; });
    }
    return true;
  }

  // ก่อนกดบันทึก: ข้อผิดร้ายแรง = บล็อก · คำเตือนใหม่ = ถามยืนยัน · คืน true ถ้าบันทึกต่อได้
  async function preSaveCheck() {
    const ids = Object.keys(S.drafts);
    if (!ids.length) return true;
    const scoped = validateAll(items).filter(function (i) { return i.docs.some(function (d) { return ids.indexOf(d) >= 0; }); });
    const severe = scoped.filter(function (i) { return i.sev === 'err'; });
    if (severe.length) {
      await issuesModal('ยังบันทึกไม่ได้ — พบข้อผิดร้ายแรง ' + severe.length + ' รายการ', severe, false,
        'แก้ไขรายการเหล่านี้ในแท็บที่เกี่ยวข้องก่อน แล้วกดบันทึกอีกครั้ง (ที่แท็บ "ตรวจความถูกต้อง" มีปุ่มพาไปแก้)');
      return false;
    }
    const base = validateAll(stored), baseSigs = {};
    base.forEach(function (i) { baseSigs[i.sig] = true; });
    const baseGaps = base.filter(function (i) { return i.cat === 'zone-gap'; }).map(function (i) { return i.gap; });
    const warns = scoped.filter(function (i) { return i.sev === 'warn' && !i.auto && isNewIssue(i, baseSigs, baseGaps); });
    if (!warns.length) return true;
    return await issuesModal('พบสิ่งที่ควรตรวจก่อนบันทึก ' + warns.length + ' รายการ', warns, true,
      'เป็นแค่คำเตือน บันทึกต่อได้ถ้าแน่ใจว่าข้อมูลถูกต้อง (รายการที่มีอยู่เดิมในฐานข้อมูลก่อนแก้ไขไม่ถูกนับซ้ำ)');
  }
  function issuesModal(title, list, canProceed, note) {
    return new Promise(function (resolve) {
      const shown = list.slice(0, 40);
      const body = '<p class="hint">' + esc(note) + '</p><div class="table-wrap"><table><tbody>' + shown.map(function (i) {
        return '<tr><td class="sev">' + vSevPill(i) + '</td><td class="wrap"><span class="hint">' + esc(vCatTitle(i.cat)) + '</span><br>' + esc(i.text) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
        (list.length > shown.length ? '<p class="hint">…และอีก ' + (list.length - shown.length) + ' รายการ ดูทั้งหมดที่แท็บ "ตรวจความถูกต้อง"</p>' : '');
      openModal(title, body, function () { resolve(canProceed); }, canProceed ? 'บันทึกต่อไป' : 'ตกลง');
      const root = $('modal-root');
      root.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { resolve(false); }); });
      root.querySelector('.modal-bg').addEventListener('mousedown', function (e) { if (e.target === e.currentTarget) resolve(false); });
      root.querySelector('.modal').style.maxWidth = '780px';
    });
  }

  function gapFillOf(g) { return S.gapFill[g.key] || {}; }
  function gapFilled(f) { return ['station', 'tambon', 'amphoe', 'moobans'].some(function (k) { return String(f[k] || '').trim(); }); }
  function saveGapFill() { try { localStorage.setItem('cn_master_gapfill', JSON.stringify(S.gapFill)); } catch (_) {} }

  /* หน้าตรวจความถูกต้อง: เมนูซ้ายแยกตามชุดข้อมูล (✓ = ผ่าน) + รายละเอียดด้านขวา */
  const V_TABS = ['routes', 'zones', 'rightofway', 'surface', 'workcodes', 'assets'];
  function vTabLabel(k) { const t = TABS.find(function (x) { return x.key === k; }); return t ? t.label : k; }
  function vIssueTab(i) { return i.cat === 'route-surface' ? 'routes' : ((VCATS.find(function (c) { return c.cat === i.cat; }) || {}).tab || i.docs[0]); }

  function renderValidate(v) {
    const all = validateAll(items), issues = all.filter(function (i) { return !i.auto; });
    const autoN = all.filter(function (i) { return i.auto; }).length;
    const err = issues.filter(function (i) { return i.sev === 'err'; }), warn = issues.filter(function (i) { return i.sev === 'warn'; });
    const gaps = computeGaps(items);
    const tabOf = function (k) { return issues.filter(function (i) { return vIssueTab(i) === k; }); };
    const clean = V_TABS.filter(function (k) { return !tabOf(k).length; }).length;
    if (!S.vSel || (S.vSel !== 'gap' && V_TABS.indexOf(S.vSel) < 0)) {
      S.vSel = V_TABS.find(function (k) { return tabOf(k).length; }) || (gaps.length ? 'gap' : V_TABS[0]);
    }
    const head = err.length ? 'พบข้อผิดร้ายแรง ' + err.length + ' รายการ — ต้องแก้ก่อนจึงบันทึกได้' : (warn.length ? 'ไม่พบข้อผิดร้ายแรง มีคำเตือน ' + warn.length + ' รายการ' : 'ข้อมูลผ่านการตรวจทั้งหมด');

  function gapExport() {
    const gaps = computeGaps(items);
    const q = function (s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; };
    const lines = [['ทางหลวง', 'ฝั่ง', 'จาก กม.', 'ถึง กม.', 'ยาว (กม.)', 'สภ.', 'ตำบล', 'อำเภอ', 'จังหวัด', 'หมู่บ้าน'].map(q).join(',')];
    gaps.forEach(function (g) {
      const f = gapFillOf(g);
      lines.push([g.hw, g.side === 'B' ? 'ทั้งสองฝั่ง' : SIDE_LABEL[g.side], f.kmStart != null ? f.kmStart : fmtKm(g.s), f.kmEnd != null ? f.kmEnd : fmtKm(g.e),
        ((g.e - g.s) / 1000).toFixed(3), f.station || '', f.tambon || '', f.amphoe || '', f.changwat != null ? f.changwat : 'ระยอง', f.moobans || ''].map(q).join(','));
    });
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);

  function gapImport() {
    const gaps = computeGaps(items), routes = items('routes'), list = items('zones').slice();
    const added = [], errs = [], doneKeys = [], stamp = Date.now().toString(36);
    gaps.forEach(function (g, idx) {
      const f = gapFillOf(g);
      if (!gapFilled(f)) return;
      const s = parseKm(f.kmStart != null ? f.kmStart : fmtKm(g.s)), e = parseKm(f.kmEnd != null ? f.kmEnd : fmtKm(g.e));
      const lbl = gapText(g);
      if (s == null || e == null || isNaN(s) || isNaN(e) || s >= e) { errs.push(lbl + ': ช่วง กม. ไม่ถูกต้อง'); return; }
      if (s < g.s - KM_TOL || e > g.e + KM_TOL) { errs.push(lbl + ': กม. ที่กรอกต้องอยู่ภายในช่วงที่ขาด'); return; }
      const rt = routes.find(function (r) { return String(r.highway) === g.hw && (r.kmRanges || []).some(function (p) { return s >= p[0] - KM_TOL && s <= p[1] + KM_TOL; }); }) ||
        routes.find(function (r) { return String(r.highway) === g.hw; });
      const o = {
        id: 'z-' + g.hw + '-' + Math.round(s) + (g.side === 'B' ? '' : '-' + g.side) + '-' + stamp + idx,
        routeId: rt ? rt.id : '', highway: g.hw, kmStart: round1(s), kmEnd: round1(e), side: g.side === 'L' ? 'ซ้ายทาง' : (g.side === 'R' ? 'ขวาทาง' : ''),
        station: String(f.station || '').trim(), tambon: String(f.tambon || '').trim(), amphoe: String(f.amphoe || '').trim(),
        changwat: String(f.changwat != null ? f.changwat : 'ระยอง').trim(),
        moobans: String(f.moobans || '').split(/[,;]+/).map(function (x) { return x.trim(); }).filter(Boolean)
      };
      list.push(o); added.push('ทล.' + o.highway + ' ' + fmtKm(o.kmStart) + '–' + fmtKm(o.kmEnd)); doneKeys.push(g.key);
    });
    if (errs.length) { alert('ยังนำเข้าไม่ได้ กรุณาแก้ก่อน:\n\n' + errs.join('\n')); return; }
    if (!added.length) { alert('ยังไม่มีแถวที่กรอก สภ. / ตำบล / อำเภอ / หมู่บ้าน อย่างน้อย 1 ช่อง'); return; }
    doneKeys.forEach(function (k) { delete S.gapFill[k]; });
    saveGapFill();
    draft('zones', list, 'นำเข้าเขตพื้นที่จากตาราง "สิ่งที่ต้องไปหาข้อมูลมาเติม" ' + added.length + ' ช่วง: ' + added.join(', '));
    toast('นำเข้า ' + added.length + ' ช่วงเป็นฉบับร่างแล้ว ตรวจในแท็บเขตพื้นที่แล้วกดบันทึก');
  }

  function normRoute(r) {
    // รองรับทั้งรูปแบบระบบอุบัติเหตุ/โจรกรรม (กม. เป็นเมตร) และระบบบริหารหมวด (routeNo, ranges เป็นกิโลเมตร)
    const isAdmin = r.routeNo != null && r.highway == null;
    const o = {
      highway: String(isAdmin ? r.routeNo : r.highway).trim(),
      controlNo: String(r.controlNo || '').trim(),
      section: String(r.section || r.sectionName || '').replace(/\s*-\s*/g, '-').trim(),
      kmRanges: (function () {
        let k = isAdmin ? r.ranges : r.kmRanges;
        if (typeof k === 'string') { try { k = JSON.parse(k); } catch (_) { k = []; } }
        return (k || []).map(function (p) { return isAdmin ? [Math.round(p[0] * 1000), Math.round(p[1] * 1000)] : [Math.round(p[0]), Math.round(p[1])]; });
      })(),
      distanceActual: num(isAdmin ? r.distActual : r.distanceActual),
      distance2Lane: num(isAdmin ? r.dist2Lane : r.distance2Lane),
      asphalt: num(r.asphalt) || 0, concrete: num(r.concrete) || 0, workQty: num(r.workQty),
      status: r.status === 'transferred' ? 'transferred' : 'active',
      transferredDate: r.transferredDate || '', transferNote: r.transferNote || '',
      asOf: r.asOf || r.updatedAt || ''
    };
    o.id = routeId(o);
    return o;
  }
  function normZone(z, routes) {
    let km0 = num(z.kmStart), km1 = num(z.kmEnd);
    const hw = String(z.highway || '').trim();
    const r = routes.find(function (x) { return x.id === z.routeId; }) ||
      routes.find(function (x) { return x.highway === hw && (x.kmRanges || []).some(function (p) { return km0 >= p[0] && km0 <= p[1]; }); }) ||
      routes.find(function (x) { return x.highway === hw; });
    let moob = z.moobans;
    if (typeof moob === 'string') { try { moob = JSON.parse(moob); } catch (_) { moob = moob.split(/[,;]+/); } }
    return {
      id: String(z.id || ('z-' + hw + '-' + km0)), routeId: r ? r.id : (z.routeId || ''), highway: hw,
      kmStart: km0, kmEnd: km1, side: z.side || '',
      station: z.station || '', tambon: z.tambon || '', amphoe: z.amphoe || '', changwat: z.changwat || '',
      moobans: (moob || []).map(function (s) { return String(s).trim(); }).filter(Boolean)
    };
  }
  function normSurface(x) {
    const side = x.side === 'Lt' || String(x.side) === '-1' ? 'Lt' : (x.side === 'Rt' || String(x.side) === '1' ? 'Rt' : String(x.side || ''));
    const o = {
      highway: String(x.highway).trim(), controlNo: String(x.controlNo || '').trim(), kmStart: num(x.kmStart), kmEnd: num(x.kmEnd), side: side,
      lanes: Number(x.lanes) || 0, laneWidth: num(x.laneWidth), surface: x.surface === 'conc' || x.surface === 'ac' ? x.surface : '',
      standard: num(x.standard), roadType: num(x.roadType), shoulderLeftWidth: num(x.shoulderLeftWidth), shoulderRightWidth: num(x.shoulderRightWidth),
      asOf: x.asOf || '', source: x.source || ''
    };
    o.id = x.id || (o.highway + '-' + o.controlNo + '-' + o.kmStart + '-' + o.side);
    return o;
  }
  function normRow(x) {
    const o = {
      highway: String(x.highway).trim(), controlNo: String(x.controlNo || '').trim(), seq: Number(x.seq) || 0,
      section: x.section || '', kmStart: num(x.kmStart), kmEnd: num(x.kmEnd), left: num(x.left), right: num(x.right),
      basis: x.basis || '', note: x.note || '', source: x.source || ''
    };
    o.id = x.id || (o.highway + '-' + (o.controlNo || '0000') + '-' + String(o.seq).padStart(3, '0'));
    return o;
  }
  // รองรับทั้งไฟล์ workcodes-seed.json และแถว job_code_reference ของระบบบริหารหมวด (jobCode/jobName/unit/description)
  function normWorkCode(x) {
    const o = {
      code: String(x.code || x.jobCode || '').trim(), name: String(x.name || x.jobName || '').trim(), nameEn: String(x.nameEn || '').trim(),
      units: Array.isArray(x.units) ? parseUnits(x.units.join(',')) : parseUnits(x.unit), parent: String(x.parent || '').trim()
    };
    const out = String(x.output || '').trim(), desc = String(x.description || x.desc || '').trim();
    if (out && out !== '-') o.output = out;
    if (desc) o.description = desc;
    return o;
  }
  function normAsset(m) {
    return {
      key: String(m.key), name: String(m.name || '').trim(), unit: String(m.unit || '').trim(), price: num(m.price) || 0,
      category: m.category || '', frequent: !!m.frequent, hidden: !!m.hidden
    };
  }
  function mergeInto(docId, incoming, keyName, mode, extra, label) {
    if (mode === 'all') {
      const inFile = new Set(incoming.map(function (x) { return x[keyName]; }));
      const before = items(docId);
      const removed = before.filter(function (x) { return !inFile.has(x[keyName]); }).length;
      draft(docId, clone(incoming), 'นำเข้า' + label + ' แทนที่ทั้งชุด: ' + incoming.length + ' รายการ' + (removed ? ' (ลบที่ไม่มีในไฟล์ ' + removed + ')' : ''), extra);
      return label + ': แทนที่ทั้งชุด ' + incoming.length + ' รายการ' + (removed ? ' · ลบที่ไม่มีในไฟล์ ' + removed : '');
    }
    const list = clone(items(docId));
    const idx = {};
    list.forEach(function (x, i) { idx[x[keyName]] = i; });
    let added = 0, replaced = 0, skipped = 0;
    incoming.forEach(function (x) {
      if (idx[x[keyName]] == null) { idx[x[keyName]] = list.length; list.push(x); added++; }
      else if (mode === 'replace') { list[idx[x[keyName]]] = x; replaced++; }
      else skipped++;
    });
    if (added || replaced) draft(docId, list, 'นำเข้า' + label + ': เพิ่ม ' + added + (replaced ? ', ทับ ' + replaced : ''), extra);
    return label + ': เพิ่มใหม่ ' + added + (replaced ? ' · ทับ ' + replaced : '') + (skipped ? ' · ข้าม (มีอยู่แล้ว) ' + skipped : '');
  }

  async function doImport(file) {
    const out = $('imp-result');
    try {
      const data = JSON.parse(await file.text());
      // ปุ่มนำเข้าในแท็บมาตรฐานงานจราจรไม่มีตัวเลือก ใช้ "ทับ" (ถามยืนยันก่อนถ้ามีข้อมูลอยู่แล้ว)
      if (!$('imp-mode') && tsDoc() && !confirm('มีมาตรฐานงานจราจรในฐานข้อมูลกลางอยู่แล้ว นำเข้าแทนที่ทั้งชุดหรือไม่?\n(ยังไม่บันทึกจนกว่าจะกดบันทึก)')) return;
      const mode = $('imp-mode') ? $('imp-mode').value : 'replace';
      const fy = Number($('imp-fy') ? $('imp-fy').value : 0) || currentFiscalYear();
      const report = [];
      const zonesIn = Array.isArray(data) ? data : data.zones;
      if (data.routes) report.push(mergeInto('routes', data.routes.map(normRoute), 'id', mode, null, 'สายทาง'));
      if (zonesIn && zonesIn.length) report.push(mergeInto('zones', zonesIn.map(function (z) { return normZone(z, items('routes')); }), 'id', mode, null, 'เขตพื้นที่'));
      if (data.surface) report.push(mergeInto('surface', data.surface.map(normSurface), 'id', mode, null, 'ผิวทาง'));
      if (data.rightofway) report.push(mergeInto('rightofway', data.rightofway.map(normRow), 'id', mode, null, 'บัญชีเขตทาง'));
      if (data.workcodes) report.push(mergeInto('workcodes', data.workcodes.map(normWorkCode).filter(function (x) { return /^\d{5}$/.test(x.code) && x.name; }), 'code', mode, null, 'รหัสงาน'));
      if (data.manuals) report.push(mergeInto('manuals', data.manuals.filter(function (x) { return x && x.id && x.title; }), 'id', mode, null, 'ทะเบียนคู่มือ'));
      if (data.trafficStd && typeof data.trafficStd === 'object') {
        // มาตรฐานงานจราจรเป็นเอกสารเดียวหลายตาราง: นำเข้าทั้งชุด (ถ้ามีอยู่แล้วและเลือก "ข้าม" จะไม่ทับ)
        const has = !!tsDoc();
        if (has && mode === 'skip') report.push('มาตรฐานงานจราจร: ข้าม (มีข้อมูลอยู่แล้ว เลือก "ใช้ข้อมูลจากไฟล์ทับ" ถ้าต้องการแทนที่)');
        else {
          const t = clone(data.trafficStd);
          TS_META.forEach(function (k) { delete t[k]; });
          const nv = TS_SECTIONS.reduce(function (s, sec) { return s + (t[sec.key] || []).filter(function (x) { return x && x.verify; }).length; }, 0);
          draft('traffic_std', [], 'นำเข้ามาตรฐานงานจราจรจากคู่มือ' + (has ? ' (แทนที่ทั้งชุด)' : '') + ': ' +
            TS_SECTIONS.filter(function (sec) { return (t[sec.key] || []).length; }).map(function (sec) { return sec.label + ' ' + t[sec.key].length; }).join(', '), t);
          report.push('มาตรฐานงานจราจร: ' + (has ? 'แทนที่ทั้งชุด' : 'นำเข้า') + ' · ต้องตรวจสอบ ' + nv + ' แถว');
          S.tsSec = 'signDistances';
        }
      }
      if (data.materials) report.push(mergeInto(assetDocId(fy), data.materials.map(normAsset), 'key', mode, { fiscalYear: fy }, 'ราคาประเมินปีงบ ' + fy));
      if (data.assets && typeof data.assets === 'object') {
        Object.keys(data.assets).forEach(function (y) {
          report.push(mergeInto(assetDocId(Number(y)), data.assets[y].map(normAsset), 'key', mode, { fiscalYear: Number(y) }, 'ราคาประเมินปีงบ ' + y));
        });
      }
      if (!report.length) throw new Error('ไม่พบข้อมูลสายทาง / เขตพื้นที่ / รหัสงาน / ราคาประเมิน / มาตรฐานงานจราจร / คู่มือ ในไฟล์นี้');
      if (S.tab === 'trafficstd') { render(); toast(report.join(' · ') + ' — ยังไม่ได้บันทึก ตรวจดูแล้วกด "บันทึกลงฐานข้อมูลกลาง"'); return; }
      S.tab = 'io'; render();
      $('imp-result').innerHTML = '✔ อ่านไฟล์ ' + esc(file.name) + ' แล้ว<br>' + report.map(esc).join('<br>') + '<br><b>ยังไม่ได้บันทึก</b> ตรวจดูในแต่ละแท็บแล้วกด "บันทึกลงฐานข้อมูลกลาง"';
    } catch (e) {
      if (out) out.innerHTML = '<span style="color:var(--red)">นำเข้าไม่สำเร็จ: ' + esc(e.message) + '</span>';
      else alert('นำเข้าไม่สำเร็จ: ' + e.message);
    }
  }

  function doExport() {
    const assets = {};
    fiscalYears().forEach(function (y) { const a = items(assetDocId(y)); if (a.length) assets[y] = a; });
    const data = { format: 'cn-master', exportedAt: new Date().toISOString(), routes: items('routes'), zones: items('zones'), rightofway: items('rightofway'), surface: items('surface'), workcodes: items('workcodes'), manuals: items('manuals'), trafficStd: tsDoc(), assets: assets };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cn-master-backup-' + todayIso() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ----- ประวัติ ----- */
  function renderHistory(v) {
    if (!S.owner) { v.innerHTML = '<div class="panel empty">ประวัติการแก้ไขดูได้เฉพาะเจ้าของเว็บ</div>'; return; }
    if (S.history === null) {
      v.innerHTML = '<div class="panel empty">กำลังโหลดประวัติ…</div>';
      S.history = 'loading';
      FBL.masterHistory(100).then(function (h) { S.history = h; render(); })
        .catch(function (e) { S.history = null; v.innerHTML = '<div class="panel empty">' + esc(e.message) + '</div>'; });
      return;
    }
    if (S.history === 'loading') return;
    // ป้ายสีตามชนิดการแก้ไข (ดูจากคำขึ้นต้นของบรรทัดสรุป)
    function kind(line) {
      if (/^(เพิ่ม|นำเข้า)/.test(line)) return ['add', 'เพิ่ม'];
      if (/^ลบ/.test(line)) return ['del', 'ลบ'];
      if (/^(แก้|เปลี่ยน|ปัดเศษ)/.test(line)) return ['edit', 'แก้ไข'];
      return ['sys', 'ระบบ'];
    }
    function linesOf(x) { return String(x.summary || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean); }
    function dayLabel(iso) {
      const d = new Date(iso), n = new Date();
      const k = function (t) { return t.getFullYear() + '-' + t.getMonth() + '-' + t.getDate(); };
      if (k(d) === k(n)) return 'วันนี้';
      if (k(d) === k(new Date(n.getTime() - 86400000))) return 'เมื่อวาน';
      return d.toLocaleDateString('th-TH', { dateStyle: 'medium' });
    }
    const all = S.history, q = S.histSearch.trim().toLowerCase();
    const docs = [];
    all.forEach(function (x) { if (docs.indexOf(x.docId) < 0) docs.push(x.docId); });
    if (S.histDoc !== '*' && docs.indexOf(S.histDoc) < 0) S.histDoc = '*';
    const items = all.filter(function (x) {
      if (S.histDoc !== '*' && x.docId !== S.histDoc) return false;
      return !q || (docTitle(x.docId) + ' ' + x.summary).toLowerCase().indexOf(q) >= 0;
    });
    const tot = { add: 0, edit: 0, del: 0 }, groups = [];
    items.forEach(function (x) {
      linesOf(x).forEach(function (l) { const c = kind(l)[0]; if (tot[c] !== undefined) tot[c]++; });
      let g = groups.filter(function (a) { return a.doc === x.docId; })[0];
      if (!g) { g = { doc: x.docId, list: [] }; groups.push(g); }
      g.list.push(x);
    });

    let h = '<div class="panel">' +
      '<div class="stats">' +
      '<div class="stat"><div class="k">ครั้งที่แก้ไข</div><div class="v">' + items.length + '</div></div>' +
      '<div class="stat"><div class="k">เอกสารที่ถูกแก้</div><div class="v">' + groups.length + '</div></div>' +
      '<div class="stat"><div class="k">เพิ่ม</div><div class="v" style="color:var(--green)">+' + tot.add + '</div></div>' +
      '<div class="stat"><div class="k">แก้ไข</div><div class="v" style="color:#B7791F">' + tot.edit + '</div></div>' +
      '<div class="stat"><div class="k">ลบ</div><div class="v" style="color:var(--red)">' + tot.del + '</div></div></div>' +
      '<div class="toolbar"><div class="grow"><input type="search" id="hist-search" placeholder="ค้นหาในประวัติ เช่น ชื่อสายทาง หรือรายการที่แก้" value="' + esc(S.histSearch) + '"></div>' +
      '<button class="btn" type="button" data-act="hist-reload">โหลดใหม่</button></div>' +
      '<div class="h-chips"><button type="button" class="h-chip' + (S.histDoc === '*' ? ' on' : '') + '" data-act="hist-f" data-id="*">ทั้งหมด</button>' +
      docs.map(function (d) { return '<button type="button" class="h-chip' + (S.histDoc === d ? ' on' : '') + '" data-act="hist-f" data-id="' + esc(d) + '">' + esc(docTitle(d)) + '</button>'; }).join('') + '</div>';
    if (!all.length) h += '<div class="empty">ยังไม่มีประวัติการแก้ไข</div>';
    else if (!groups.length) h += '<div class="empty">ไม่พบรายการที่ตรงกับตัวกรอง</div>';
    groups.forEach(function (g, gi) {
      let sid = S.histSel[g.doc];
      if (!g.list.some(function (x) { return x.__id === sid; })) sid = g.list[0].__id;
      const cur = g.list.filter(function (x) { return x.__id === sid; })[0];
      const open = S.histOpen[g.doc] !== undefined ? S.histOpen[g.doc] : gi === 0 || !!q;
      h += '<div class="h-grp' + (open ? ' open' : '') + '"><div class="h-gh" data-act="hist-grp" data-id="' + esc(g.doc) + '"><span class="h-car">▶</span><h4>' + esc(docTitle(g.doc)) + '</h4>' +
        '<div class="h-cnt"><span class="hint">แก้ล่าสุด ' + esc(dayLabel(g.list[0].at)) + '</span><span class="io-chip">' + g.list.length + ' ครั้ง</span></div></div><div class="h-gb"><div class="h-chain">';
      g.list.slice().reverse().forEach(function (x, i) {
        if (i) h += '<span class="ln"></span>';
        h += '<button type="button" class="h-vchip' + (x.__id === sid ? ' on' : '') + '" data-act="hist-ver" data-id="' + esc(x.__id) + '">รุ่น ' + x.toVersion + '</button>';
      });
      h += '</div><div class="h-vinfo"><div class="top"><span>รุ่น ' + cur.fromVersion + ' → ' + cur.toVersion + '</span><span>' + esc(fmtDateTime(cur.at)) + '</span></div><ul>' +
        linesOf(cur).map(function (l) { const k = kind(l); return '<li><span class="h-tag ' + k[0] + '">' + k[1] + '</span>' + esc(l) + '</li>'; }).join('') + '</ul>' +
        '<div style="margin-top:12px">' + (cur.fromVersion
          ? '<button class="btn sm" type="button" data-act="hist-restore" data-id="' + esc(cur.__id) + '">กู้คืนเป็นฉบับก่อนการแก้ไขนี้ (รุ่น ' + cur.fromVersion + ')</button>'
          : '<span class="hint">รุ่นแรก ไม่มีฉบับก่อนหน้าให้กู้คืน</span>') + '</div></div></div></div>';
    });
    if (all.length >= 100) h += '<p class="hint" style="margin:10px 0 0">แสดงการแก้ไขล่าสุด 100 ครั้ง</p>';
    v.innerHTML = h + '</div>';
  }

  /* ---------- modal ---------- */
  function field(name, label, value, type, attrs, cls) {
    return '<label class="f' + (cls ? ' ' + cls : '') + '">' + esc(label) +
      '<input name="' + name + '" type="' + (type || 'text') + '" value="' + esc(value == null ? '' : value) + '" ' + (attrs || '') + '></label>';
  }
  function openModal(title, bodyHtml, onSubmit, submitLabel) {
    const root = $('modal-root');
    root.innerHTML = '<div class="modal-bg"><form class="modal" novalidate>' +
      '<div class="modal-head"><h3>' + esc(title) + '</h3><button type="button" class="modal-x" data-close title="ปิด" aria-label="ปิด">×</button></div>' +
      '<div class="modal-body">' + bodyHtml + '<div class="form-err"></div></div>' +
      '<div class="modal-actions"><button type="button" class="btn" data-close>ยกเลิก</button>' +
      '<button type="submit" class="btn primary">' + esc(submitLabel || 'ตกลง') + '</button></div></form></div>';
    const form = root.querySelector('form');
    const close = function () { root.innerHTML = ''; };
    root.querySelectorAll('[data-close]').forEach(function (b) { b.onclick = close; });
    root.querySelector('.modal-bg').addEventListener('mousedown', function (e) { if (e.target === e.currentTarget) close(); });
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const f = {};
      Array.from(form.elements).forEach(function (el) {
        if (!el.name) return;
        f[el.name] = el.type === 'checkbox' ? el.checked : el.value;
      });
      const btn = form.querySelector('[type=submit]'); btn.disabled = true;
      try {
        const err = await onSubmit(f);
        if (err) { form.querySelector('.form-err').textContent = err; btn.disabled = false; return; }
        close();
      } catch (ex) { form.querySelector('.form-err').textContent = ex.message; btn.disabled = false; }
    });
    const first = form.querySelector('input:not([readonly]),textarea,select');
    if (first) first.focus();
  }

  function loginForm() {
    openModal('เข้าสู่ระบบเจ้าของเว็บ',
      '<div class="form-grid">' + field('id', 'ID เจ้าของ', '', 'text', 'autocomplete="username"', 'full') +
      field('pw', 'รหัสผ่าน', '', 'password', 'autocomplete="current-password"', 'full') + '</div>',
      async function (f) { await FBL.login(f.id, f.pw); }, 'เข้าสู่ระบบ');
  }

  /* ---------- ปุ่มต่างๆ ---------- */
  document.addEventListener('click', function (e) {
    const wg = e.target.closest('[data-wc-g],[data-wc-s]');
    if (wg) {
      if (wg.dataset.wcG !== undefined) { S.wcGroup = wg.dataset.wcG; S.wcSub = '*'; }
      else S.wcSub = S.wcSub === wg.dataset.wcS ? '*' : wg.dataset.wcS;
      render(); return;
    }
    const t = e.target.closest('[data-tab],[data-act]');
    if (!t) return;
    if (t.tagName === 'TR' && e.target.closest('details')) return; // กดเปิด/ปิด "ลักษณะงาน" ในแถว ไม่ต้องเปิดหน้าแก้ไข
    // กดลิงก์/ช่องกรอกที่อยู่ในแถว (หรือบล็อก) ที่คลิกแล้วแก้ไข ไม่ต้องเปิดหน้าแก้ไข
    const inner = e.target.closest('a[href],button,input,select,textarea,summary');
    if (inner && inner !== t && /-edit$/.test(t.dataset.act || '')) return;
    if (t.dataset.tab) {
      S.tab = t.dataset.tab;
      try { localStorage.setItem('cn_master_tab', S.tab); } catch (_) {}
      try { history.replaceState(null, '', '#' + S.tab); } catch (_) {} // ลิงก์ในแถบที่อยู่ตรงกับแท็บที่เปิด (คัดลอกไปส่งต่อได้)
      render(); return;
    }
    const id = t.dataset.id;
    switch (t.dataset.act) {
      case 'route-add': routeForm(null); break;
      case 'route-edit': routeForm(items('routes').find(function (x) { return x.id === id; })); break;
      case 'route-del': {
        const r = items('routes').find(function (x) { return x.id === id; });
        if (confirm('ลบสายทาง ' + r.highway + ' ตอน ' + r.controlNo + ' ออกจากฐานข้อมูลกลาง?\n\nถ้าโอนสายทางให้หน่วยงานอื่น แนะนำให้กด "แก้ไข" แล้วเปลี่ยนสถานะเป็น "โอนแล้ว" แทน')) {
          draft('routes', items('routes').filter(function (x) { return x.id !== id; }), 'ลบสายทาง ' + r.highway + ' ตอน ' + r.controlNo);
          $('modal-root').innerHTML = '';
        }
        break;
      }
      case 'zone-add': zoneForm(null); break;
      case 'zone-hw': S.zoneHw = id; render(); break;
      case 'zone-edit': zoneForm(items('zones').find(function (x) { return x.id === id; })); break;
      case 'zone-del': {
        const z = items('zones').find(function (x) { return x.id === id; });
        if (confirm('ลบเขตพื้นที่ ทล.' + z.highway + ' ' + fmtKm(z.kmStart) + '–' + fmtKm(z.kmEnd) + '?')) {
          draft('zones', items('zones').filter(function (x) { return x.id !== id; }), 'ลบเขตพื้นที่ ทล.' + z.highway + ' ' + fmtKm(z.kmStart) + '–' + fmtKm(z.kmEnd));
          $('modal-root').innerHTML = '';
        }
        break;
      }
      case 'route-calc': routeStatsForm(); break;
      case 'surf-add': surfaceForm(null); break;
      case 'surf-edit': surfaceForm(items('surface').find(function (x) { return x.id === id; })); break;
      case 'surf-del': {
        const x = items('surface').find(function (r) { return r.id === id; });
        if (confirm('ลบช่วงผิวทาง ทล.' + x.highway + ' ' + fmtKm(x.kmStart) + '–' + fmtKm(x.kmEnd) + ' (' + (SIDE_TH[x.side] || x.side) + ')?')) {
          draft('surface', items('surface').filter(function (r) { return r.id !== id; }), 'ลบผิวทาง ทล.' + x.highway + ' ' + fmtKm(x.kmStart) + '–' + fmtKm(x.kmEnd) + ' ' + (SIDE_TH[x.side] || x.side));
          $('modal-root').innerHTML = '';
        }
        break;
      }
      case 'surf-hw': S.surfHw = id; render(); break;
      case 'row-hw': S.rowHw = id; render(); break;
      case 'row-add': rowForm(null); break;
      case 'row-edit': rowForm(items('rightofway').find(function (x) { return x.id === id; })); break;
      case 'row-del': {
        const x = items('rightofway').find(function (r) { return r.id === id; });
        if (confirm('ลบช่วงเขตทาง ทล.' + x.highway + ' ลำดับ ' + x.seq + ' (' + fmtKm(x.kmStart) + '–' + fmtKm(x.kmEnd) + ')?')) {
          draft('rightofway', items('rightofway').filter(function (r) { return r.id !== id; }), 'ลบเขตทาง ทล.' + x.highway + ' ลำดับ ' + x.seq);
          $('modal-root').innerHTML = '';
        }
        break;
      }
      case 'wc-add': workCodeForm(null); break;
      case 'wc-edit': workCodeForm(items('workcodes').find(function (x) { return x.code === id; })); break;
      case 'wc-del': {
        const x = items('workcodes').find(function (r) { return r.code === id; });
        const kids = items('workcodes').filter(function (r) { return r.parent === id; });
        if (kids.length) { alert('รหัส ' + id + ' มีรหัสย่อยอยู่ ' + kids.length + ' รหัส (' + kids.slice(0, 5).map(function (r) { return r.code; }).join(', ') + (kids.length > 5 ? ' …' : '') + ') ลบรหัสย่อยหรือย้ายไปอยู่ใต้รหัสอื่นก่อน'); break; }
        if (confirm('ลบรหัสงาน ' + x.code + ' ' + x.name + ' ออกจากฐานข้อมูลกลาง?\n\nระบบงานที่เคยใช้รหัสนี้จะเลือกหน่วยนับจากฐานข้อมูลกลางไม่ได้')) {
          draft('workcodes', items('workcodes').filter(function (r) { return r.code !== id; }), 'ลบรหัสงาน ' + x.code + ' ' + x.name.slice(0, 40));
          $('modal-root').innerHTML = '';
        }
        break;
      }
      case 'ts-add': tsRowForm(null); break;
      case 'ts-edit': tsRowForm(Number(id)); break;
      case 'ts-del': {
        const sec = tsSection(S.tsSec), x = (tsDoc()[sec.key] || [])[Number(id)];
        const label = x && (x.code || x.name || x.topic || x.device || x.item || x.roadLabel || x.label || x.id || (x.speed != null ? x.speed + ' กม./ชม.' : ''));
        if (x && confirm('ลบแถว "' + label + '" ออกจากตาราง ' + sec.label + '?')) {
          tsEdit(function (d) { d[sec.key].splice(Number(id), 1); }, 'ลบ' + sec.label + ': ' + String(label).slice(0, 60));
          $('modal-root').innerHTML = '';
        }
        break;
      }
      case 'man-add': manualForm(null); break;
      case 'man-edit': manualForm(items('manuals').find(function (x) { return x.id === id; })); break;
      case 'man-del': {
        const x = items('manuals').find(function (r) { return r.id === id; });
        if (confirm('ลบคู่มือ ' + x.id + ' ' + x.title + ' ออกจากทะเบียน?')) {
          draft('manuals', items('manuals').filter(function (r) { return r.id !== id; }), 'ลบคู่มือ ' + x.id);
          $('modal-root').innerHTML = '';
        }
        break;
      }
      case 'goto':
        S.tab = id;
        try { localStorage.setItem('cn_master_tab', S.tab); } catch (_) {}
        try { history.replaceState(null, '', '#' + S.tab); } catch (_) {}
        render(); window.scrollTo(0, 0); break;
      case 'v-sel': S.vSel = id; render(); break;
      case 'gap-export': gapExport(); break;
      case 'gap-import': gapImport(); break;
      case 'asset-add': assetForm(null); break;
      case 'asset-edit': assetForm(assetView(currentFiscalYear()).find(function (x) { return x.key === id; })); break;
      case 'asset-src': S.assetSrc = id; render(); break;
      case 'asset-del': {
        const cy = currentFiscalYear();
        const x = assetView(cy).find(function (r) { return r.key === id; });
        if (!x) break;
        const older = fiscalYears().some(function (y) { return y < cy && items(assetDocId(y)).some(function (r) { return r.key === id; }); });
        if (older) { alert('รายการ ' + id + ' มีราคาอยู่ในปีงบก่อนหน้า ลบไม่ได้ เพราะเคสเก่ายังอ้างถึงอยู่\n\nถ้าเลิกใช้ ให้ติ๊ก "ซ่อน (เลิกใช้)" ในหน้าแก้ไขแทน'); break; }
        if (confirm('ลบรายการ ' + x.key + ' ' + x.name.slice(0, 50) + ' ออกจากราคาประเมิน?')) {
          editAssets(id, null, 'ลบ ' + x.key + ' ' + x.name.slice(0, 40));
          $('modal-root').innerHTML = '';
        }
        break;
      }
      case 'export': doExport(); break;
      case 'hist-reload': S.history = null; render(); break;
      case 'hist-f': S.histDoc = id; render(); break;
      case 'hist-grp': {
        const box = t.closest('.h-grp'); // สลับจากสถานะที่เห็นอยู่บนหน้าจอ
        S.histOpen[id] = !(box && box.classList.contains('open')); render(); break;
      }
      case 'hist-ver': {
        const x = (S.history || []).find(function (h) { return h.__id === id; });
        if (x) { S.histSel[x.docId] = id; render(); }
        break;
      }
      case 'hist-restore': {
        const x = S.history.find(function (h) { return h.__id === id; });
        if (!x) break;
        if (confirm('โหลด' + docTitle(x.docId) + ' รุ่น ' + x.fromVersion + ' กลับมาเป็นฉบับร่าง?\n(ยังไม่บันทึกจนกว่าจะกดบันทึก)')) {
          const before = JSON.parse(x.before || '[]');
          if (!Array.isArray(before)) draft(x.docId, [], 'กู้คืนเป็นฉบับรุ่น ' + x.fromVersion, before); // เอกสารหลายตาราง (traffic_std)
          else draft(x.docId, before, 'กู้คืนเป็นฉบับรุ่น ' + x.fromVersion, /^assets_/.test(x.docId) ? { fiscalYear: Number(x.docId.slice(7)) } : null);
          toast('โหลดฉบับรุ่น ' + x.fromVersion + ' เป็นฉบับร่างแล้ว ตรวจดูแล้วกดบันทึก');
        }
        break;
      }
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'fy-select') { S.fy = Number(e.target.value); render(); }
    else if (e.target.id === 'asset-cat') { S.assetCat = e.target.value; render(); }
    else if (e.target.id === 'row-area') { S.rowInArea = e.target.checked; render(); }
    else if (e.target.id === 'ts-sec') { S.tsSec = e.target.value; render(); }
    else if (e.target.id === 'ts-verify') { S.tsVerifyOnly = e.target.checked; render(); }
    else if (e.target.id === 'man-cat') { S.manCat = e.target.value; render(); }
    else if ((e.target.id === 'imp-file' || e.target.id === 'ts-file') && e.target.files[0]) doImport(e.target.files[0]);
  });
  // ลากไฟล์มาวางในกรอบนำเข้า
  document.addEventListener('dragover', function (e) {
    const d = e.target.closest && e.target.closest('#imp-drop');
    if (d) { e.preventDefault(); d.classList.add('over'); }
  });
  document.addEventListener('dragleave', function (e) {
    const d = e.target.closest && e.target.closest('#imp-drop');
    if (d) d.classList.remove('over');
  });
  document.addEventListener('drop', function (e) {
    const d = e.target.closest && e.target.closest('#imp-drop');
    if (!d) return;
    e.preventDefault(); d.classList.remove('over');
    if (e.dataTransfer.files[0]) doImport(e.dataTransfer.files[0]);
  });
  document.addEventListener('input', function (e) {
    if (e.target.dataset && e.target.dataset.gk) {
      // ตารางเติมเขตพื้นที่: เก็บค่าไว้เฉย ๆ ไม่วาดหน้าใหม่ (ไม่งั้นเคอร์เซอร์หลุด)
      const k = e.target.dataset.gk;
      (S.gapFill[k] = S.gapFill[k] || {})[e.target.dataset.gf] = e.target.value;
      saveGapFill();
    } else if (e.target.id === 'asset-search') {
      S.assetSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const el = $('asset-search'); el.focus(); el.setSelectionRange(pos, pos);
    } else if (e.target.id === 'wc-search') {
      S.wcSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const el = $('wc-search'); el.focus(); el.setSelectionRange(pos, pos);
    } else if (e.target.id === 'hist-search') {
      S.histSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const el = $('hist-search'); el.focus(); el.setSelectionRange(pos, pos);
    } else if (e.target.id === 'man-search') {
      S.manSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const el = $('man-search'); el.focus(); el.setSelectionRange(pos, pos);
    }
  });

  $('btn-login').addEventListener('click', async function () {
    if (!S.owner) { loginForm(); return; }
    if (Object.keys(S.drafts).length && !confirm('ยังมีการแก้ไขที่ไม่ได้บันทึก ออกจากระบบแล้วการแก้ไขจะหาย ต้องการออกหรือไม่?')) return;
    S.drafts = {};
    await FBL.logout();
  });
  $('btn-discard').addEventListener('click', function () {
    if (!confirm('ยกเลิกการแก้ไขทั้งหมดที่ยังไม่บันทึก?')) return;
    S.drafts = {}; render();
  });
  $('btn-save').addEventListener('click', async function () {
    const btn = this;
    roundDraftKm(); // ปัด กม. ให้ทศนิยมไม่เกิน 1 ตำแหน่งของเมตรก่อนตรวจและบันทึก
    if (!(await preSaveCheck())) { render(); return; }
    btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    const ids = Object.keys(S.drafts);
    const done = [];
    try {
      for (const docId of ids) {
        const d = S.drafts[docId];
        const expect = S.master[docId] ? (S.master[docId].version || 0) : 0;
        await FBL.saveMaster(docId, d.items, d.extra, d.changes.join('\n'), expect);
        delete S.drafts[docId];
        done.push(docTitle(docId));
      }
      S.history = null;
      toast('บันทึกแล้ว: ' + done.join(', ') + ' — ทุกระบบงานจะเห็นข้อมูลใหม่ทันที');
    } catch (e) {
      alert('บันทึกไม่สำเร็จ' + (done.length ? ' (บันทึกสำเร็จไปแล้ว: ' + done.join(', ') + ')' : '') + '\n\n' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = 'บันทึกลงฐานข้อมูลกลาง';
      render();
    }
  });
  window.addEventListener('beforeunload', function (e) {
    if (Object.keys(S.drafts).length) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------- เริ่มทำงาน ---------- */
  render();
  if (FBL.configured) {
    FBL.onError = function (msg) { toast(msg); };
    FBL.onAuth(function (owner) {
      S.owner = owner;
      if (!owner) { S.drafts = {}; S.history = null; }
      render();
    });
    FBL.watchMaster(function (m) { S.master = m; S.loaded = true; S.loadError = ''; render(); }, function (msg) {
      S.loaded = true;
      S.loadError = 'อ่านฐานข้อมูลกลางไม่ได้: ' + msg + ' — ถ้าเพิ่งติดตั้ง ให้วางไฟล์ firestore.rules ชุดใหม่ใน Firebase Console ก่อน';
      render();
    });
  }
})();
</script>
</body>
</html>
